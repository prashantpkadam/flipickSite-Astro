name: Deploy to staging

# Every push to the staging branch builds the site and uploads it to
# staging.flipick.com over FTPS. Test here before promoting staging to main.
on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys to the same server folder at once.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required secrets
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          STAGING_MAIL_OVERRIDE_TO: ${{ secrets.STAGING_MAIL_OVERRIDE_TO }}
        run: |
          missing=0
          for name in FTP_HOST FTP_USERNAME FTP_PASSWORD SMTP_HOST SMTP_PORT SMTP_USERNAME SMTP_PASSWORD SMTP_FROM STAGING_MAIL_OVERRIDE_TO; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          exit $missing

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Write the form settings (api/.env) into the build
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
          STAGING_MAIL_OVERRIDE_TO: ${{ secrets.STAGING_MAIL_OVERRIDE_TO }}
        run: |
          umask 077
          {
            printf 'SMTP_HOST=%s\n' "$SMTP_HOST"
            printf 'SMTP_PORT=%s\n' "$SMTP_PORT"
            printf 'SMTP_USERNAME=%s\n' "$SMTP_USERNAME"
            printf 'SMTP_PASSWORD=%s\n' "$SMTP_PASSWORD"
            printf 'SMTP_FROM=%s\n' "$SMTP_FROM"
            printf 'SMTP_FROM_NAME=%s\n' "${SMTP_FROM_NAME:-Flipick}"
            # Staging safety: every email goes to this address, never to the real
            # recipients. The RECIPIENTS_* secrets are deliberately not written to staging.
            printf 'MAIL_OVERRIDE_TO=%s\n' "$STAGING_MAIL_OVERRIDE_TO"
          } > dist/api/.env
          echo "Wrote dist/api/.env with $(wc -l < dist/api/.env) settings (values hidden)"

      - name: Upload to Hostinger (staging)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./dist/
          # Set the repository variable STAGING_FTP_DIR to the staging folder on Hostinger.
          server-dir: ${{ vars.STAGING_FTP_DIR || '/public_html/staging-git/' }}
