name: Build check

# Runs the site build on every pull request into staging or main, and on every
# push to dev. A broken page, schema or blog post fails here, so it can never be
# merged and deployed. Needs no secrets.
on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Check the build output
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html is missing"; exit 1; }
          test -f dist/404.html || { echo "::error::dist/404.html is missing"; exit 1; }
          test -f dist/.htaccess || { echo "::error::dist/.htaccess is missing"; exit 1; }
          test -f dist/api/send-mail.php || { echo "::error::dist/api/send-mail.php is missing"; exit 1; }
          test -f dist/api/blocked-email-domains.json || { echo "::error::blocked-email-domains.json is missing"; exit 1; }
          echo "Pages built: $(find dist -name '*.html' | wc -l)"
